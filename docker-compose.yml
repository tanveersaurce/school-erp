services:
  # ==========================================
  # PRIMARY DATABASE: MongoDB 7.0
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: edusphere-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edusphere_net

  # ==========================================
  # CACHE & QUEUE ENGINE: Redis 7.4
  # ==========================================
  redis:
    image: redis:7.4-alpine
    container_name: edusphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edusphere_net

  # ==========================================
  # BACKEND API: Node.js Express Server
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: edusphere-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=mongodb://mongodb:27017/edusphere_dev
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=local_dev_jwt_access_secret_key_32_characters_minimum_len
      - JWT_REFRESH_SECRET=local_dev_jwt_refresh_secret_key_32_characters_minimum_len
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edusphere_net

  # ==========================================
  # FRONTEND: React 19 Vite / Nginx SPA
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: edusphere-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - edusphere_net

volumes:
  mongodb_data:
    name: edusphere_mongodb_data
  redis_data:
    name: edusphere_redis_data

networks:
  edusphere_net:
    name: edusphere_network
    driver: bridge
